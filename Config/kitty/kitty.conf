enable_audio_bell no

include color.ini

font_family      HackNerdFont

font_size 12

# El build de HackNerdFont es antiguo y no trae el logo de Kali (U+F327);
# lo tomamos de la 3270 Nerd Font solo para ese glifo.
symbol_map U+F327 3270Medium Nerd Font Mono
# Logo Bolado (glifo propio en una fuente generada del PNG del logo)
symbol_map U+E800 Bolado Logo

disable_ligatures never

url_color #f0f0f0

url_style curly

use_software_render yes

map ctrl+left  neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up    neighboring_window up
map ctrl+down  neighboring_window down

map F1 copy_to_buffer a
map F2 paste_from_buffer a
map F3 copy_to_buffer b
map F4 paste_from_buffer b

cursor_shape beam
cursor_beam_thickness 1.8

mouse_hide_wait 3.0
detect_urls yes

repaint_delay 10
input_delay 0
sync_to_monitor no

# ── Layouts ───────────────────────────────────────────────────────────
enabled_layouts splits,stack,tall

# ── Splits (paneles dentro de la tab) ────────────────────────────────
map ctrl+shift+backslash  launch --location=vsplit --cwd=current
map ctrl+shift+minus      launch --location=hsplit --cwd=current
map ctrl+shift+w          close_window
map ctrl+shift+z          toggle_layout stack

# ── Tabs ──────────────────────────────────────────────────────────────
tab_bar_style powerline
active_tab_background  #f0f0f0
active_tab_foreground  #0d0d0d
inactive_tab_background #1a1a1a
inactive_tab_foreground #8a8a8a
tab_bar_margin_color black

map ctrl+shift+t          new_tab_with_cwd
map ctrl+shift+right      next_tab
map ctrl+shift+left       prev_tab
map ctrl+shift+q          close_tab
map ctrl+alt+t            set_tab_title
map ctrl+shift+period     move_tab_forward
map ctrl+shift+comma      move_tab_backward

map ctrl+shift+enter      kitten ~/.config/kitty/split_toggle.py

background_opacity 0.78

shell kitty_start
