[color]
;; Paleta mínima · mono + 1 acento (violeta).
;; Todo el tema (polybar, dunst, scripts, bspwm) se monta sobre estas 5 entradas.
bg     = #16161D
fg     = #DCD7BA
dim    = #54546D
accent = #957FB8
error  = #C34043

trans  = #00000000
black  = #16161D
white  = #DCD7BA

;; Aliases retrocompatibles con current.ini — todos colapsan a las 5 anteriores
;; para que módulos/temas heredados no tengan que reescribirse.
ac          = ${color.accent}
ac-fg       = ${color.bg}
red         = ${color.error}
pink        = ${color.accent}
purple      = ${color.accent}
deep-purple = ${color.accent}
indigo      = ${color.dim}
blue        = ${color.accent}
light-blue  = ${color.fg}
cyan        = ${color.dim}
teal        = ${color.dim}
green       = ${color.accent}
light-green = ${color.fg}
lime        = ${color.fg}
yellow      = ${color.accent}
amber       = ${color.accent}
orange      = ${color.accent}
deep-orange = ${color.accent}
brown       = ${color.dim}
gray        = ${color.dim}
blue-gray   = ${color.dim}
