# BoladoBSPWM — teclado persistente a nivel de servidor X
# Layouts: español + inglés. Alternar con Alt+Shift.
# Lo instala install.sh en /etc/X11/xorg.conf.d/00-keyboard.conf
# (más fiable que `setxkbmap … &` en bspwmrc: se aplica al arrancar X,
#  no depende del WM ni se pierde entre sesiones).
Section "InputClass"
    Identifier         "system-keyboard"
    MatchIsKeyboard    "on"
    Option "XkbLayout"  "es,us"
    Option "XkbModel"   "pc105"
    Option "XkbOptions" "grp:alt_shift_toggle"
EndSection
