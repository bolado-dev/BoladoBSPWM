# BoladoBSPWM — lightdm-mini-greeter · Tokyo Night
# Usuario: sustituido por install.sh con el username real
[greeter]
user                    = BOLADO_USER
show-password-label     = true
password-label-text     = ❯
invalid-password-text   = acceso denegado
show-input-cursor       = true
password-alignment      = left
password-input-width    = 28
show-image-on-all-monitors = true
show-sys-info           = true

[greeter-hotkeys]
mod-key      = meta
shutdown-key = s
restart-key  = r
hibernate-key = h
suspend-key  = u
session-key  = e

[greeter-theme]
# Tipografía monospace — misma familia que kitty
font             = "JetBrainsMono Nerd Font, Iosevka Nerd Font, Monospace"
font-size        = 1.0em
font-weight      = bold
font-style       = normal

# Paleta Kanagawa Wave
text-color                  = "#DCD7BA"
error-color                 = "#C34043"
background-color            = "#16161D"
window-color                = "#1F1F28"
border-color                = "#957FB8"
border-width                = 2px
password-color              = "#DCD7BA"
password-background-color   = "#1F1F28"
password-border-color       = "#7E9CD8"
password-border-width       = 2px
password-border-radius      = 8px

# Bullet redondo en lugar de asterisco (UTF-8 0x2022 → decimal 8226)
password-character          = 8226

# Espaciado más amplio (look respirado)
layout-space                = 20

# Fondo: wallpaper Tokyo Night
background-image            = "/usr/share/pixmaps/bolado-bspwm.png"
background-image-size       = cover

# sys-info: user@hostname + reloj (estética terminal)
sys-info-font               = "JetBrainsMono Nerd Font, Iosevka Nerd Font, Monospace"
sys-info-font-size          = 0.8em
sys-info-color              = "#7E9CD8"
sys-info-margin             = 0px 0px 10px
