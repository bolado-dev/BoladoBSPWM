# BoladoBSPWM — lightdm-mini-greeter · tema terminal monocromo
# Usuario: sustituido por install.sh con el username real
[greeter]
user                    = BOLADO_USER
show-password-label     = true
password-label-text     = $
invalid-password-text   = acceso denegado
show-input-cursor       = true
password-alignment      = left
password-input-width    = 24
show-image-on-all-monitors = true
show-sys-info           = true

[greeter-hotkeys]
mod-key      = meta
shutdown-key = s
restart-key  = r
hibernate-key = h
suspend-key  = u
session-key  = e

[greeter-theme]
# Tipografía monospace — misma familia que kitty
font             = "Monospace"
font-size        = 0.95em
font-weight      = normal
font-style       = normal

# Paleta BoladoBSPWM
text-color                  = "#e6e6e6"
error-color                 = "#e05561"
background-color            = "#0d0d0d"
window-color                = "#141414"
border-color                = "#1a1a1a"
border-width                = 1px
password-color              = "#f0f0f0"
password-background-color   = "#0d0d0d"
password-border-color       = "#ffb300"
password-border-width       = 1px
password-border-radius      = 14px

# * como caracter de contraseña (ASCII 42)
password-character          = 42

# Espaciado compacto
layout-space                = 10

# Fondo: Senna oscurecido — match con el wallpaper del escritorio
background-image            = "/usr/share/pixmaps/bolado-greeter.png"
background-image-size       = cover

# sys-info: user@hostname + reloj (estética terminal)
sys-info-font               = "Monospace"
sys-info-font-size          = 0.75em
sys-info-margin             = 0px 0px 6px
